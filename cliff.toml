# Changelog generation. CHANGELOG.md is produced from the commit history and
# is never hand-edited — see payload/.claude/rules/release.md.
#
#   git cliff -o CHANGELOG.md
[changelog]
header = """
# Changelog

Generated from the commit history with [git-cliff](https://git-cliff.org).
Do not edit by hand: an edit is lost at the next generation, which teaches
everyone to stop trusting the file. Write the commit subject instead.

"""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug fixes" },
  { message = "^docs", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^test", group = "Tests" },
  { message = "^build|^ci", group = "Build and CI" },
  { message = "^chore", skip = true },
]
tag_pattern = "v[0-9]*"
